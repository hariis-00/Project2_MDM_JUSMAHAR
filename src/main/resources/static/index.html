<!DOCTYPE html>
<html>

<head>
    <title>Hunderassen-Klassifizierung</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
        crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" async></script>
</head>

<body>
    <div class="container">
        <div class="jumbotron text-center">
            <h1 class="display-4">🐾 Hunderassen-Klassifizierung</h1>
            <p class="lead">KI erkennt die Rasse deines Hundes anhand eines Fotos.</p>
            <p class="lead">Erstellt durch Haris Jusmani (jusmahar@students.zhaw.ch)</p>
        </div>

        <div id="drop-area" class="border p-4 text-center bg-light">
            <p>Datei hierher ziehen oder klicken zum Hochladen (JPEG, PNG)</p>
            <input type="file" id="imageUpload" accept="image/*" hidden />
            <button type="button" class="btn btn-primary" onclick="document.getElementById('imageUpload').click();">Datei auswählen</button>
        </div>

        <div id="loadingPart" class="text-center my-4" style="display: none;">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExd3A4a3p2NzJtODJqMGI5Z3M2NzV0OGN6Z3J6MDdkcWo5Z2xuZTk5cSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/qshS9lLCCzAKPf76Ia/giphy.gif" alt="Ladeanimation Hund" class="mb-3" style="max-height: 200px;" />
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Analyse läuft...</span>
            </div>
            <p class="mt-2">🐶 Bild wird analysiert...</p>
        </div>


        <div id="answerPart" style="visibility: hidden;">
            <div class="card shadow rounded mt-4">
                <div class="card-body">
                    <h5 class="card-title">📊 Ergebnis:</h5>
                    <div id="answer" class="card-text"></div>
                </div>
            </div>

            <div class="card mt-3 shadow rounded" id="previewPart">
                <div class="card-body text-center">
                    <h5 class="card-title">🖼️ Hochgeladenes Bild:</h5>
                    <img id="preview" class="img-thumbnail rounded" src="#" alt="Bildvorschau" />
                </div>
            </div>
        </div>
    </div>
</body>

</html>
